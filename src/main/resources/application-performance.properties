spring.application.name=bankingtransactionsystem-performance

spring.datasource.url=jdbc:mysql://localhost:3306/banking_performance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5

server.port=8082
logging.level.com.banking.bankingtransactionsystem.service.TransactionService=WARN